services:
  web:
    build: ./backend-showcase
    ports: 
      - "5173:5173"
    volumes: 
      - ./backend-showcase:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
  
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true